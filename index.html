<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Stoku Opname</title><style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}.wrap{max-width:760px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.item{background:white;border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 2px 8px #0001}.num{font-size:24px;font-weight:bold}input,select,button{padding:11px;border-radius:9px;border:1px solid #d1d5db;font-size:15px}input{width:100%;box-sizing:border-box;margin:8px 0}button{font-weight:bold;background:#111827;color:white}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.box{text-align:center;background:#f9fafb;padding:8px;border-radius:8px}.box b{display:block;font-size:18px}.ok{color:#166534}.minus{color:#b91c1c}.plus{color:#1d4ed8}.tag{background:#e5e7eb;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:bold}.actions{display:flex;gap:6px}.hint{font-size:13px;color:#4b5563}</style></head><body><header><div class="wrap" style="padding:0"><h1>📋 Stoku Opname</h1><small>Master barang tetap • cukup isi LPPTK & stok fisik</small></div></header><main class="wrap"><div class="cards"><div class="card">Total Barang<div class="num" id="total">0</div></div><div class="card">Sudah Lengkap<div class="num" id="done">0</div></div><div class="card">Sesuai<div class="num" id="ok">0</div></div><div class="card">Ada Selisih<div class="num" id="diff">0</div></div></div><input id="search" placeholder="🔎 Cari kode / nama barang" oninput="render()"><div class="hint">Kategori MBF permanen. Nama dan kode tidak perlu diketik saat opname.</div><div id="list"></div></main><script>
const MASTER=[{"kategori": "MBF", "kode": "20142228", "nama": "CAP ENAK CHOCO 535G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20125783", "nama": "CAP/ENAK KKM PTH 535", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20140647", "nama": "ENAK K/MNS COKLAT260", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20140646", "nama": "ENAK K/MNS PUTIH 260", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20143301", "nama": "INDMLK CRM MTCHA 260", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10005489", "nama": "FF KENTAL MANIS 370G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10000255", "nama": "FF GOLD SKM PTH 370G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20002313", "nama": "FF KRM MNS OMELA 370", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20054589", "nama": "3SAPI KRIMER 490G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10030059", "nama": "CARNATION K/MNS 488G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10036665", "nama": "CARNATION KKM 365G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20105631", "nama": "CARNATION KKM 405G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20101859", "nama": "SUNBAY EVP.MILK 380G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20136510", "nama": "MILO 3IN1 ACT-GO 400", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20027850", "nama": "ZEE VNILA TWST 340G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20027848", "nama": "ZEE SWIZZ CHO 340G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10033006", "nama": "PRENAGEN HML CHO 180", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20011063", "nama": "PRENAGEN HML CHO 360", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20033353", "nama": "HILO/S HI-CAL CHO250", "satuan": "pcs"}, {"kategori": "MBF", "kode": "10000578", "nama": "DIABETASOL VNL 170GR", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20142907", "nama": "MILKOW A/G 1 MDU 600", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20142909", "nama": "MILKOW A/G 1 VNL 600", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20142910", "nama": "MILKOW A/G 1 MDU 900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20142908", "nama": "MILKOW A/G 1 VNL 900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20070110", "nama": "VDORAN XMRT1+ MDU700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20090042", "nama": "VDORAN XMRT1+ VAN700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20082394", "nama": "VDORAN XMRT3+ MDU700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20090437", "nama": "VDORAN XMRT3+ VAN700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20117983", "nama": "VIDORAN XM5+ COKL700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20098371", "nama": "VDORAN SUSU MADU 325", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20098369", "nama": "VDORAN XMRT3+ VAN350", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20101825", "nama": "VDRAN XMRT1+ MDU 900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20113346", "nama": "VDRAN XMRT1+ VAN 900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20106381", "nama": "VDRAN XMRT3+ MDU 900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20098370", "nama": "VDORAN XMRT1+ MDU325", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20098368", "nama": "VDORAN XMRT1+ VAN325", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20138473", "nama": "VDORAN BABY6-12 900G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20117981", "nama": "VIDORAN XM3+ VNL900", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20138474", "nama": "VIDORAN 5 MADU 900G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20135200", "nama": "VIDORAN BABY0-6 550G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20129773", "nama": "VDORAN BABY6-12 550G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20117985", "nama": "VIDORAN XM5+ MADU700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20142954", "nama": "VIDORAN 5+VAN 700G", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20125788", "nama": "HLTHYWY1+ SP MADU700", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20032058", "nama": "FF KENTAL MANIS 6X37", "satuan": "pcs"}, {"kategori": "MBF", "kode": "20013433", "nama": "INDOMILK SKM PTH6X37", "satuan": "pcs"}];const KEY='stoku_opname_mbf_v2';let opname=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(opname))}
function val(k,key){let p=MASTER.find(x=>x.kode===k),v=prompt((key==='lpptk'?'Stok LPPTK':'Stok Fisik')+' — '+p.nama,opname[k]?.[key]??'');if(v===null)return;if(v.trim()===''){if(opname[k])delete opname[k][key];save();render();return}let n=Number(v);if(!Number.isInteger(n)||n<0)return alert('Masukkan angka bulat 0 atau lebih.');if(!opname[k])opname[k]={};opname[k][key]=n;save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){let q=document.getElementById('search').value.toLowerCase(),list=MASTER.filter(x=>(x.nama+' '+x.kode).toLowerCase().includes(q)),done=MASTER.filter(x=>opname[x.kode]?.lpptk!=null&&opname[x.kode]?.fisik!=null),oks=done.filter(x=>opname[x.kode].fisik===opname[x.kode].lpptk);document.getElementById('total').textContent=MASTER.length;document.getElementById('done').textContent=done.length;document.getElementById('ok').textContent=oks.length;document.getElementById('diff').textContent=done.length-oks.length;document.getElementById('list').innerHTML=list.map(x=>{let o=opname[x.kode]||{},c=o.lpptk!=null&&o.fisik!=null,d=c?o.fisik-o.lpptk:null,cl=d===0?'ok':d<0?'minus':'plus';return `<div class="item"><span class="tag">MBF</span><h3>${esc(x.nama)}</h3><small>Kode: ${esc(x.kode)} • ${x.satuan}</small><div class="grid"><div class="box">LPPTK<b>${o.lpptk??'-'}</b></div><div class="box">Fisik<b>${o.fisik??'-'}</b></div><div class="box">Selisih<b class="${c?cl:''}">${d===null?'-':d>0?'+'+d:d}</b></div></div><p class="${c?cl:''}"><b>${!c?'Belum lengkap':d===0?'Sesuai':d<0?'Kurang '+Math.abs(d):'Lebih +'+d}</b></p><div class="actions"><button onclick="val('${x.kode}','lpptk')">Input LPPTK</button><button onclick="val('${x.kode}','fisik')">Input Fisik</button></div></div>`}).join('')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
