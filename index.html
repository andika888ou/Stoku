<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoku Opname</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"><link rel="icon" href="icons/icon-192.png"><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}.wrap{max-width:760px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.item{background:white;border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 2px 8px #0001}.num{font-size:24px;font-weight:bold}.row{display:flex;gap:8px}input,select,button{padding:11px;border-radius:9px;border:1px solid #d1d5db;font-size:15px}input,select{width:100%;margin:5px 0 10px}button{font-weight:bold}.primary{background:#111827;color:white}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.box{text-align:center;background:#f9fafb;padding:8px;border-radius:8px}.box b{display:block;font-size:18px}.tag{display:inline-block;background:#e5e7eb;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:bold}.ok{color:#166534}.minus{color:#b91c1c}.plus{color:#1d4ed8}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}#modal{display:none;position:fixed;inset:0;background:#0008;padding:20px}.modal{background:white;padding:18px;border-radius:15px;max-width:500px;margin:35px auto}</style></head><body><header><div class="wrap" style="padding:0"><h1>📋 Stoku Opname</h1><small>Master barang tetap • input LPPTK & stok fisik</small></div></header><main class="wrap"><div class="cards"><div class="card">Total Barang<div class="num" id="total">0</div></div><div class="card">Sudah Lengkap<div class="num" id="done">0</div></div><div class="card">Sesuai<div class="num" id="ok">0</div></div><div class="card">Selisih<div class="num" id="diff">0</div></div></div><div class="row"><input id="search" placeholder="🔎 Cari kode / nama / kategori" oninput="render()"><button class="primary" onclick="modal()">+ Master</button></div><div class="row"><select id="cat" onchange="render()"><option value="">Semua kategori</option></select><select id="filter" onchange="render()"><option value="all">Semua status</option><option value="belum">Belum lengkap</option><option value="ok">Sesuai</option><option value="selisih">Ada selisih</option></select></div><div id="list"></div></main><div id="modal"><div class="modal"><h2>Master Barang</h2><input id="kategori" placeholder="Kategori tetap, contoh GULA"><input id="kode" placeholder="Kode barang tetap"><input id="nama" placeholder="Nama barang tetap"><input id="satuan" placeholder="Satuan, contoh pcs"><div class="row"><button onclick="closeModal()">Batal</button><button class="primary" onclick="saveItem()">Simpan</button></div></div></div><script>
let data=JSON.parse(localStorage.getItem('stoku_master_revisi')||'[]'),edit=null,$=x=>document.getElementById(x);function persist(){localStorage.setItem('stoku_master_revisi',JSON.stringify(data))}function modal(id=null){edit=id;$('modal').style.display='block';if(id){let x=data.find(a=>a.id===id);$('kategori').value=x.kategori;$('kode').value=x.kode;$('nama').value=x.nama;$('satuan').value=x.satuan}else['kategori','kode','nama','satuan'].forEach(x=>$(x).value='')}function closeModal(){$('modal').style.display='none'}function saveItem(){let k=$('kategori').value.trim().toUpperCase(),c=$('kode').value.trim(),n=$('nama').value.trim();if(!k||!c||!n)return alert('Kategori, kode, dan nama wajib diisi.');let old=edit?data.find(x=>x.id===edit):null,x={id:edit||Date.now(),kategori:k,kode:c,nama:n,satuan:$('satuan').value.trim()||'pcs',lpptk:old?.lpptk??null,fisik:old?.fisik??null};if(edit)data[data.findIndex(a=>a.id===edit)]=x;else data.push(x);persist();closeModal();render()}function input(id,key){let x=data.find(a=>a.id===id),v=prompt((key==='lpptk'?'Stok LPPTK':'Stok Fisik')+' — '+x.nama,x[key]??'');if(v===null||v.trim()==='')return;let n=Number(v);if(!Number.isInteger(n)||n<0)return alert('Masukkan angka 0 atau lebih.');x[key]=n;persist();render()}function del(id){if(confirm('Hapus master barang?')){data=data.filter(x=>x.id!==id);persist();render()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){let q=$('search').value.toLowerCase(),cf=$('cat').value,f=$('filter').value,cats=[...new Set(data.map(x=>x.kategori))].sort(),old=cf;$('cat').innerHTML='<option value="">Semua kategori</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');if(cats.includes(old))$('cat').value=old;let a=data.filter(x=>(x.nama+' '+x.kode+' '+x.kategori).toLowerCase().includes(q)&&(!cf||x.kategori===cf)).filter(x=>{let complete=x.lpptk!==null&&x.fisik!==null,d=complete?x.fisik-x.lpptk:null;return f==='all'||(f==='belum'&&!complete)||(f==='ok'&&d===0)||(f==='selisih'&&complete&&d!==0)}),complete=data.filter(x=>x.lpptk!==null&&x.fisik!==null),oks=complete.filter(x=>x.fisik===x.lpptk);$('total').textContent=data.length;$('done').textContent=complete.length;$('ok').textContent=oks.length;$('diff').textContent=complete.length-oks.length;$('list').innerHTML=a.length?a.map(x=>{let complete=x.lpptk!==null&&x.fisik!==null,d=complete?x.fisik-x.lpptk:null,cls=d===0?'ok':d<0?'minus':'plus';return `<div class="item"><span class="tag">${esc(x.kategori)}</span><h3>${esc(x.nama)}</h3><small>Kode: ${esc(x.kode)} • ${esc(x.satuan)}</small><div class="grid"><div class="box">LPPTK<b>${x.lpptk??'-'}</b></div><div class="box">Fisik<b>${x.fisik??'-'}</b></div><div class="box">Selisih<b class="${complete?cls:''}">${d===null?'-':d>0?'+'+d:d}</b></div></div><p class="${complete?cls:''}"><b>${!complete?'Belum lengkap':d===0?'Sesuai':d<0?'Kurang '+Math.abs(d):'Lebih +'+d}</b></p><div class="actions"><button class="primary" onclick="input(${x.id},'lpptk')">Input LPPTK</button><button class="primary" onclick="input(${x.id},'fisik')">Input Fisik</button><button onclick="modal(${x.id})">Edit Master</button><button onclick="del(${x.id})">Hapus</button></div></div>`}).join(''):'<div class="card" style="text-align:center">Tidak ada barang.</div>'}render();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));}</script></body></html>
